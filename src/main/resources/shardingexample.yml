databaseName: wallet

dataSources:
  shardwallet1:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    jdbcUrl: jdbc:mysql://localhost:3306/<YOUR_SHARD1_DATABASE>?allowPublicKeyRetrieval=true&useSSL=false
    username: <YOUR_DB_USERNAME>
    password: <YOUR_DB_PASSWORD>
    driverClassName: com.mysql.cj.jdbc.Driver

  shardwallet2:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    jdbcUrl: jdbc:mysql://localhost:3306/<YOUR_SHARD2_DATABASE>?allowPublicKeyRetrieval=true&useSSL=false
    username: <YOUR_DB_USERNAME>
    password: <YOUR_DB_PASSWORD>
    driverClassName: com.mysql.cj.jdbc.Driver

rules:
  - !SHARDING
    defaultDatabaseStrategy:
      standard:
        shardingColumn: id
        shardingAlgorithmName: db-inline

    tables:
      user:
        actualDataNodes: shardwallet$->{1..2}.user
        databaseStrategy:
          standard:
            shardingColumn: id
            shardingAlgorithmName: db-inline
        keyGenerateStrategy:
          column: id
          keyGeneratorName: snowflakestrategy

      wallet:
        actualDataNodes: shardwallet$->{1..2}.wallet
        databaseStrategy:
          standard:
            shardingColumn: user_id
            shardingAlgorithmName: user-id-inline
        keyGenerateStrategy:
          column: id
          keyGeneratorName: snowflakestrategy

      transaction:
        actualDataNodes: shardwallet$->{1..2}.transaction
        databaseStrategy:
          standard:
            shardingColumn: from_wallet_id
            shardingAlgorithmName: transaction-inline
        keyGenerateStrategy:
          column: id
          keyGeneratorName: snowflakestrategy

      saga_instance:
        actualDataNodes: shardwallet$->{1..2}.saga_instance
        databaseStrategy:
          standard:
            shardingColumn: id
            shardingAlgorithmName: db-inline
        keyGenerateStrategy:
          column: id
          keyGeneratorName: snowflakestrategy

      saga_step:
        actualDataNodes: shardwallet$->{1..2}.saga_step
        databaseStrategy:
          standard:
            shardingColumn: id
            shardingAlgorithmName: db-inline
        keyGenerateStrategy:
          column: id
          keyGeneratorName: snowflakestrategy

    shardingAlgorithms:
      db-inline:
        type: INLINE
        props:
          algorithm-expression: shardwallet${Math.abs(Long.hashCode(id)) % 2 + 1}

      user-id-inline:
        type: INLINE
        props:
          algorithm-expression: shardwallet${Math.abs(Long.hashCode(user_id)) % 2 + 1}

      transaction-inline:
        type: INLINE
        props:
          algorithm-expression: shardwallet${Math.abs(Long.hashCode(from_wallet_id)) % 2 + 1}

    keyGenerators:
      snowflakestrategy:
        type: SNOWFLAKE